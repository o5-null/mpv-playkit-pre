# 打包配置清单：把"基准配置 + 每个档位包的差异"集中在这一处。
#
# 基准 = 仓库里的 portable_config/（来自 mpv-lazy 最后发版的配置，本地维护；
# 只有 portable_config/shaders/ 跟随上游 hooke007/mpv_PlayKit 更新）。
#
# 本清单只做三件事：
#   1. 生成 portable_config/input_uosc.conf 与 portable_config/menu.conf 里的
#      VF 预设区（标记 # >>> playkit-config:vf 与 # <<< playkit-config:vf 之间）；
#   2. 生成 menu.conf 里的原生滤镜区（标记 # >>> playkit-config:native 与
#      # <<< playkit-config:native 之间，插在 VF 滤镜与着色器中间）；
#   3. 按各包启用的预设裁剪 portable_config/vs/*.vpy——没启用的预设，vpy 不进包。
#
# 生成器是 build/config.py；改配置优先改这里，不要直接改标记区里的内容。
schema: 1

# 预设表：顺序即生成顺序。key 与 vpy 都不可重复。
# requires 只用于解释"为什么这个包没启用"，会写进被注释掉的行里。
presets:
  - id: mvt_lq
    key: "!"
    vpy: vs/MEMC_MVT_LQ.vpy
    label: 预设 补帧 MVTools_快速
    requires: mvtools

  - id: rife_dml
    key: "@"
    vpy: vs/MEMC_RIFE_DML.vpy
    label: 预设 补帧 RIFE_DX12
    requires: vsmlrt DirectML

  - id: drba_dml
    key: SHARP
    vpy: vs/MEMC_DRBA_DML.vpy
    label: 预设 补帧 DRBA_DX12
    requires: vsmlrt DirectML

  - id: rife_nv
    key: "$"
    vpy: vs/MEMC_RIFE_NV.vpy
    label: 预设 补帧 RIFE_RTX (DLC-vsNV)
    requires: vsmlrt TensorRT

  - id: drba_nv
    key: "%"
    vpy: vs/MEMC_DRBA_NV.vpy
    label: 预设 补帧 DRBA_RTX (DLC-vsNV)
    requires: vsmlrt TensorRT

  - id: uai_dml
    key: "^"
    vpy: vs/MIX_UAI_DML.vpy
    label: 预设 自定义AI UAI_DX12
    requires: vsmlrt DirectML

  - id: uai_nv_trt
    key: "&"
    vpy: vs/MIX_UAI_NV_TRT.vpy
    label: 预设 自定义AI UAI_RTX (DLC-vsNV)
    requires: vsmlrt TensorRT

  # 下面四个是 vs-dlssg 的帧生成引擎，插件（vdlssg / vxessfg / vvfg / vfsr4）
  # 由 manifests/packs/vsdlssg.yml 装进 vs-plugins/，其他包不可用。
  - id: dlssg
    key: "*"
    vpy: vs/MEMC_DLSSG_NV.vpy
    label: 预设 补帧 Dlss (DLC-vsNV)
    requires: vsdlssg 引擎 vdlssg

  - id: xessfg
    key: "("
    vpy: vs/MEMC_XESSFG_NV.vpy
    label: 预设 补帧 XeSS-FG (DLC-vsNV)
    requires: vsdlssg 引擎 vxessfg

  - id: vfg
    key: ")"
    vpy: vs/MEMC_VFG_NV.vpy
    label: 预设 补帧 VFG (DLC-vsNV)
    requires: vsdlssg 引擎 vvfg

  - id: fsr4
    key: "_"
    vpy: vs/MEMC_FSR4.vpy
    label: 预设 补帧 FSR4
    requires: vsdlssg 引擎 vfsr4

# 原生滤镜段：menu.conf 里插在 VF 滤镜与着色器之间的独立标记区
# （# >>> playkit-config:native / # <<< playkit-config:native）。
# 每个条目生成一个二级菜单，multi 的每一档生成一个子项；只有 packs 里列出的
# 档位才生成——其他包没有对应的 DLL/运行时，宁可整段不出现，也不留点不动的项。
# 命令固定是 `set hwdec d3d11va; vf set <vf>:multi=N:<params>`：零拷贝只认 D3D11
# 硬件帧，auto-copy 拿到的是软件帧，滤镜会静默直通（没有 2×，也不报错）。
native:
  section: 原生滤镜 (&P)
  clear_label: 清空 (&C)
  # 清空要一起把解码模式还回去，否则后面的 VS 预设会拿到 D3D11 帧
  clear_command: vf clr playkit; set hwdec auto-copy
  entries:
    - id: dlssg_native
      label: DLSS 帧生成 (&D)
      packs: [vsdlssg]
      vf: playkit
      multi: [2, 3, 4, 5, 6]
      # 打包后必须存在的文件（相对 stage），缺失即构建失败
      file: vs-plugins/vdlssg.dll
      params:
        dll: vs-plugins/vdlssg.dll
        proxy_dir: vs-plugins/dlss45

# 每个包启用的预设（id）。
# base = 中间基础 stage 的配置（assemble / smoke / verify 用它；全量档位包打包时会被包名覆盖），
#        只放基础依赖（mpv + k7sfunc + 随包 VS 插件）就能直接跑的预设——当前只有 mvtools。
# 没列出的预设会生成成注释行，并在行尾写明它需要什么。
packs:
  base:
    enable:
      - mvt_lq

  vsdlssg:
    enable:
      - mvt_lq
      - dlssg
      - xessfg
      - vfg
      - fsr4

  vs-mlrt:
    enable:
      - mvt_lq
      - rife_nv
      - drba_nv
      - uai_nv_trt
