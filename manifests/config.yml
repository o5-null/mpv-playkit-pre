# 打包配置清单：把"基准配置 + 每个档位包的差异"集中在这一处。
#
# 基准 = 仓库里的 portable_config/（来自 mpv-lazy 最后发版的配置，本地维护；
# 只有 portable_config/shaders/ 跟随上游 hooke007/mpv_PlayKit 更新）。
#
# 本清单只做四件事：
#   1. 生成 portable_config/input_uosc.conf 与 portable_config/menu.conf 里的
#      VF 预设区（标记 # >>> playkit-config:vf 与 # <<< playkit-config:vf 之间）；
#   2. 生成 menu.conf 里的原生滤镜区（标记 # >>> playkit-config:native 与
#      # <<< playkit-config:native 之间，紧跟 VS 预设、在着色器之前）；
#   3. 生成通用倍数区与补帧参数面板的入口（playkit-config:multi / :vpypar），
#      它们只在启用了帧生成预设的包里出现；
#   4. 按各包启用的预设裁剪 portable_config/vs/*.vpy——没启用的预设，vpy 不进包。
#
# 生成器是 build/config.py；改配置优先改这里，不要直接改标记区里的内容。
schema: 1

# 预设表：顺序即生成顺序。key 不可重复；同一个 vpy 可以出现在多个预设里
# （例如"只补帧"与"补帧+超分+时序"共用 MEMC_RIFE_AJI.vpy），但同一组 vpys 只出现一次。
# requires 只用于解释"为什么这个包没启用"，会写进被注释掉的行里。
presets:
  - id: mvt_lq
    key: "!"
    vpy: vs/MEMC_MVT_LQ.vpy
    label: 预设 补帧 MVTools_快速
    requires: mvtools

  # 下面四个是 vs-dlssg 的帧生成引擎，插件（vdlssg / vxessfg / vvfg / vfsr4）
  # 由 manifests/packs/vsdlssg.yml 装进 vs-plugins/，其他包不可用。
  - id: dlssg
    key: "*"
    vpy: vs/MEMC_DLSSG_NV.vpy
    label: 预设 补帧 Dlss 2-6x (DLC-vsFG)
    requires: vsdlssg 引擎 vdlssg
    multi: true

  - id: xessfg
    key: "("
    vpy: vs/MEMC_XESSFG_NV.vpy
    label: 预设 补帧 XeSS-FG 2× (DLC-vsFG)
    requires: vsdlssg 引擎 vxessfg
    multi: true

  - id: vfg
    key: ")"
    vpy: vs/MEMC_VFG_NV.vpy
    label: 预设 补帧 VFG 2-6× (DLC-vsFG)
    requires: vsdlssg 引擎 vvfg
    multi: true

  - id: fsr4
    key: "_"
    vpy: vs/MEMC_FSR4.vpy
    label: 预设 补帧 FSR4 (DLC-vsFG)
    requires: vsdlssg 引擎 vfsr4
    multi: true

  # 下面四个是 aji（AnimeJaNai libaji）的叠层，全部走同一个脚本 vs/MIX_AJI.vpy：
  # mpv 一条 vf 链只允许一个 vapoursynth 实例，插帧/超分/时序只能在同一个 vpy 里串联。
  # 预设本身不写滤镜，而是把「层与补帧引擎」交给「设置 (&V)」面板（k7f_vpypar.lua），
  # 由它写进 user-data 并重建那一条条目 —— 模型、后端、阈值、显卡、日志都是全局项，
  # 改一次对三层同时生效。
  # 运行时（vsaji.dll + aji.dll + 模型）由 manifests/packs/vs-aji.yml 装到
  # vs-plugins/aji/，同时复制 vsaji.dll 到 Lib/site-packages/vapoursynth/plugins/ 供 R82+ 自动加载。
  - id: aji_rife
    key: "+"
    vpy: vs/MIX_AJI.vpy
    panel_set:
      - stages f
      - framegen vaji
    label: 预设 补帧 RIFE (Aji 2-6×)
    requires: vsaji 运行时
    multi: true

  - id: aji_upscale
    key: "="
    vpy: vs/MIX_AJI.vpy
    panel_set:
      - stages u
    label: 预设 超分 Aji 2×
    requires: vsaji 运行时

  - id: aji_tfix
    key: "?"
    vpy: vs/MIX_AJI.vpy
    panel_set:
      - stages t
    label: 预设 时序 Aji
    requires: vsaji 运行时

  - id: aji_stack
    key: "<"
    vpy: vs/MIX_AJI.vpy
    panel_set:
      - stages fut
      - framegen vaji
    label: 预设 叠加 补帧+超分+时序 (Aji)
    requires: vsaji 运行时
    multi: true

# 原生滤镜段：menu.conf 里紧跟 VS 预设区、在着色器之前的独立标记区
# （# >>> playkit-config:native / # <<< playkit-config:native）。
# 每个条目只有一条命令，倍率跟随「倍数 (&M)」菜单（不再有倍率子菜单）；只有
# packs 里列出的档位才生成——其他包没有对应的 DLL/运行时，宁可整段不出现，
# 也不留点不动的项。
# 命令固定是 `set hwdec d3d11va; script-message-to <target> native <vf>:<params>`：
# 倍率由 k7f_multi 在创建滤镜时一并写进 multi，一条命令只初始化一次引擎。
# 零拷贝只认 D3D11 硬件帧，auto-copy 拿到的是软件帧，滤镜会静默直通（没有 2×，
# 也不报错），所以必须先切 hwdec。
native:
  section: 原生滤镜 (&P)
  clear_label: 清空 (&C)
  # 清空要一起把解码模式还回去，否则后面的 VS 预设会拿到 D3D11 帧
  clear_command: vf clr playkit; set hwdec auto-copy
  entries:
    - id: dlssg_native
      label: DLSS 帧生成 (&D)
      packs: [vsdlssg, vs-aji, dev]
      vf: playkit
      # 套用时把规格发给它，由它注入当前倍数（省略则默认 k7f_multi）
      target: k7f_multi
      # 打包后必须存在的文件（相对 stage），缺失即构建失败
      file: vs-plugins/vdlssg.dll
      params:
        dll: vs-plugins/vdlssg.dll
        proxy_dir: vs-plugins/dlss45

# 通用倍数段：menu.conf 里紧跟 VF 预设的独立标记区
# （# >>> playkit-config:multi / # <<< playkit-config:multi）。
# 菜单只发消息给 k7f_multi.lua：倍数存在 ~~/_cache/k7f_multi.json 里，重启后仍然生效；
# 改倍数时脚本把 multi 写进当前 vf 的 user-data（playkit 滤镜则写 multi 参数），
# 之后套用的任何预设也会自动补上。只有"本包启用了 multi: true 的预设"时才生成——
# base 包是 MVTools，不解析 user-data，生成了也只是点不动的死选项。
multi:
  section: 倍数 (&M)
  follow_label: 跟随预设 (&F)
  target: k7f_multi
  entries: [2, 3, 4, 5, 6]

# 设置（补帧参数面板）：menu.conf 里在「工具」与「关于」之间的独立标记区
# （# >>> playkit-config:vpypar / # <<< playkit-config:vpypar），
# input_uosc.conf 里紧跟 VS 预设（那个按键打开同一个面板）。
# 面板由 k7f_vpypar.lua 用 input.select 画：它按当前 vf 链里的补帧脚本自动切换参数表
# （DLSSG / XeSS-FG / VFG / FSR4 各一份），改动写进 vf 的 user-data 后重建滤镜；
# 参数存在 ~~/_cache/k7f_vpypar.json，重启后沿用。
# 与 multi 一样，只在"本包启用了会读 user-data 的预设"时生成。
vpypar:
  section: 设置 (&V)
  target: k7f_vpypar
  key: V

# 每个包启用的预设（id）。
# base = 中间基础 stage 的配置（assemble / smoke / verify 用它；全量档位包打包时会被包名覆盖），
#        只放基础依赖（mpv + k7sfunc + 随包 VS 插件）就能直接跑的预设——当前只有 mvtools。
# 没列出的预设会生成成注释行，并在行尾写明它需要什么。
packs:
  base:
    enable:
      - mvt_lq

  vsdlssg:
    enable:
      - mvt_lq
      - dlssg
      - xessfg
      - vfg
      - fsr4

  # aji 档（全量包）：vsdlssg 的全部预设 + aji 三层叠加/超分/时序。
  # 帧生成引擎运行时与 aji 运行时/模型都由 manifests/packs/vs-aji.yml 装配。
  vs-aji:
    enable:
      - mvt_lq
      - dlssg
      - xessfg
      - vfg
      - fsr4
      - aji_rife
      - aji_upscale
      - aji_tfix
      - aji_stack

  # 本地 `dev\mpv` 用的全集：vsdlssg 那套 + aji 三层，方便一个播放器里来回切换。
  # 只用于 `python -m build config --stage dev\mpv --pack dev`，不进任何发行归档。
  dev:
    enable:
      - mvt_lq
      - dlssg
      - xessfg
      - vfg
      - fsr4
      - aji_rife
      - aji_upscale
      - aji_tfix
      - aji_stack
