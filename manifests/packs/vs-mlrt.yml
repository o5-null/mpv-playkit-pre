# 档位包：vs-mlrt（TensorRT-RTX 推理）—— 全量包，自带基础播放器
#
# 包名沿用 vs-mlrt（插件家族的叫法），内容就是 TensorRT-RTX 那一档；
# 对应上游 mpv_PlayKit 的 "vsNV" 定位：拿 GPU 跑超分/补帧的推理那一档。
# 它是**可选档**：默认档是 vsdlssg（帧生成引擎），需要 TRT 超分/去块/DRBA 的下这个全量包。
# 这里除了"插件 + 运行库"，还带六族模型（cugan / dpir 去块 / 通用超分 / ArtCNN /
# RIFE / DRBA）与 Python 侧依赖（onnx 等），开箱即可跑 CUGAN_NV / ARTCNN_NV /
# RIFE_NV / DRBA_NV / DPIR_DBLK_NV；DPIR 的两个去噪模型与 madVR 仍按需另下。
#
# 为什么是 TensorRT-RTX 而不是完整 TensorRT：
#   完整 TensorRT 的 CUDA 后端要 >1GB 的 CUDA 库；TRT-RTX 是官方"<200MB 的
#   drop-in 替代"，支持 Turing(7.5)–Blackwell，靠 AOT+JIT 现场编译引擎。
#   k7sfunc 侧对应后端是 core.trt_rtx（vsmlrt.py），与 core.trt 并存。
#
# 为什么用 AliceTeaParty 的重编译轮子（重要）：
#   VapourSynth R80 起移除了 API 3，而上游 vs-mlrt（含 v16.4.test1）全系仍按
#   API 3 编译，在 R82 上直接被拒（"uses API 3, which is no longer supported"），
#   上游维护者明确表示不迁移（AmusementClub/vs-mlrt#171）。
#   AliceTeaParty/vapoursynth-api4-wheels 把上游 vendored 源码（pinned revision
#   761a313）改成 API 4 并发布 pip wheel，`core.trt_rtx` 的函数面与调用签名与
#   上游一致，K7sfunc 侧脚本无需改动。实测（R82 + RTX 3080）：插件自动加载，
#   Version() = TensorRT-RTX 1.5 / CUDA runtime 12.9。
#
# 目录布局由 wheel 自己决定，不能改：
#   Lib/site-packages/vapoursynth/plugins/vsmlrt/vstrt_rtx.dll          <- 插件
#   Lib/site-packages/vapoursynth/plugins/vsmlrt/vsmlrt-cuda/*.dll      <- 运行库
# vstrt 运行时按 <本 dll 所在目录>\vsmlrt-cuda\tensorrt_rtx_<major>_<minor>.dll
# 预加载（vs-mlrt vstrt/win32.cpp 的 loadDLLs），所以两者必须保持这个相对关系。

schema: 1
name: vs-mlrt
title: vs-mlrt 全量包（TensorRT-RTX 推理档）
full: true
summary: >-
  vs-mlrt 的 vstrt_rtx 插件（API 4 重编译）+ TensorRT-RTX 1.5 运行库 +
  onnx 等 Python 依赖 + 六族模型（cugan / dpir 去块 / 通用超分 / ArtCNN /
  RIFE / DRBA），让 K7sfunc 的 TRT-RTX 后端开箱可用。
  DPIR 的两个去噪模型与 madVR 仍需自己下到 vsmlrt/models/dpir/ 与 vs-plugins/。

components:
  # 插件本体：wheel 里只有 vapoursynth/plugins/vsmlrt/vstrt_rtx.dll（535 KB）。
  - id: vstrt-rtx
    kind: whl
    summary: vs-mlrt TensorRT-RTX 插件（API 4 重编译）
    upstream: AliceTeaParty/vapoursynth-api4-wheels
    license: GPL-3.0-or-later
    install_to: Lib/site-packages
    exclude:
      - "*.dist-info"
      - "*.dist-info/*"
    provides:
      - Lib/site-packages/vapoursynth/plugins/vsmlrt/vstrt_rtx.dll

  # 运行库：tensorrt_rtx_1_5.dll（206 MB）+ onnxparser + tensorrt_rtx.exe（builder）。
  # 三个文件都在 vapoursynth/plugins/vsmlrt/vsmlrt-cuda/ 下，按原样展开即可。
  - id: trt-rtx-libs
    kind: whl
    summary: TensorRT-RTX 1.5 运行库（tensorrt_rtx + onnxparser + builder）
    upstream: AliceTeaParty/vapoursynth-api4-wheels
    license: NVIDIA TensorRT License Agreement
    install_to: Lib/site-packages
    exclude:
      - "*.dist-info"
      - "*.dist-info/*"
    provides:
      - Lib/site-packages/vapoursynth/plugins/vsmlrt/vsmlrt-cuda/tensorrt_rtx_1_5.dll
      - Lib/site-packages/vapoursynth/plugins/vsmlrt/vsmlrt-cuda/tensorrt_onnxparser_rtx_1_5.dll

  # ---- Python 侧依赖 ----
  # vstrt 建引擎时在 Python 里读 onnx（推形状、转 fp16），而 embed Python 没有 pip，
  # 所以这些包必须随包落到 Lib/site-packages。版本按 Python 3.15 选标签：
  #   onnx / protobuf 是 abi3 轮子（cp312-abi3 / cp310-abi3 可直接用）
  #   numpy / ml_dtypes 没有 abi3，必须精确 cp315
  - id: py-onnx
    kind: whl
    summary: onnx（TRT 建引擎时读取/改写模型）
    upstream: onnx/onnx
    license: Apache-2.0
    install_to: Lib/site-packages
    # 保留 *.dist-info：包从元数据读自己的版本号，删掉后 onnx 会报 'unknown'
    provides: ["Lib/site-packages/onnx/__init__.py"]

  - id: py-onnxconverter-common
    kind: whl
    summary: onnxconverter-common（fp16 模型转换）
    upstream: microsoft/onnxconverter-common
    license: MIT
    install_to: Lib/site-packages
    # 保留 *.dist-info：包从元数据读自己的版本号，删掉后 onnx 会报 'unknown'
    provides: ["Lib/site-packages/onnxconverter_common/__init__.py"]

  - id: py-numpy
    kind: whl
    summary: numpy 2.5（CPython 3.15 轮子）
    upstream: numpy/numpy
    license: BSD-3-Clause
    install_to: Lib/site-packages
    # 保留 *.dist-info：包从元数据读自己的版本号，删掉后 onnx 会报 'unknown'
    provides: ["Lib/site-packages/numpy/__init__.py"]

  - id: py-protobuf
    kind: whl
    summary: protobuf（onnx 的序列化依赖）
    upstream: protocolbuffers/protobuf
    license: BSD-3-Clause
    install_to: Lib/site-packages
    # 保留 *.dist-info：包从元数据读自己的版本号，删掉后 onnx 会报 'unknown'
    provides: ["Lib/site-packages/google/protobuf/__init__.py"]

  - id: py-typing-extensions
    kind: whl
    summary: typing_extensions（onnx / ml_dtypes 的依赖）
    upstream: python/typing_extensions
    license: PSF-2.0
    install_to: Lib/site-packages
    # 保留 *.dist-info：包从元数据读自己的版本号，删掉后 onnx 会报 'unknown'
    provides: ["Lib/site-packages/typing_extensions.py"]

  - id: py-ml-dtypes
    kind: whl
    summary: ml_dtypes 0.7（CPython 3.15 轮子）
    upstream: jax-ml/ml_dtypes
    license: Apache-2.0
    install_to: Lib/site-packages
    # 保留 *.dist-info：包从元数据读自己的版本号，删掉后 onnx 会报 'unknown'
    provides: ["Lib/site-packages/ml_dtypes/__init__.py"]

  - id: py-packaging
    kind: whl
    summary: packaging（onnxconverter-common 的依赖）
    upstream: pypa/packaging
    license: Apache-2.0 OR BSD-2-Clause
    install_to: Lib/site-packages
    # 保留 *.dist-info：包从元数据读自己的版本号，删掉后 onnx 会报 'unknown'
    provides: ["Lib/site-packages/packaging/__init__.py"]

  # ---- 模型 ----
  # 来源：hooke007/dotfiles 的 mpv_addones 资产（与 mpv_PlayKit 的模型包同源）。
  # 7z 内的目录前缀决定了 install_to：
  #   cugan 包内含 cugan/ 目录 -> 解到 vsmlrt/models 即得 models/cugan/*.onnx
  #   dpir 包是平铺文件      -> 解到 vsmlrt/models/dpir 才是 K7sfunc 找的路径
  - id: models-cugan
    kind: archive
    summary: cugan 超分模型（pro/conservative/denoise 三个 up2x）
    upstream: hooke007/dotfiles
    license: MIT
    extract: 7z
    install_to: Lib/site-packages/vapoursynth/plugins/vsmlrt/models
    provides:
      - Lib/site-packages/vapoursynth/plugins/vsmlrt/models/cugan/pro-conservative-up2x.onnx
      - Lib/site-packages/vapoursynth/plugins/vsmlrt/models/cugan/pro-denoise3x-up2x.onnx
      - Lib/site-packages/vapoursynth/plugins/vsmlrt/models/cugan/pro-no-denoise3x-up2x.onnx

  - id: models-dpir
    kind: archive
    summary: DPIR 去块模型（drunet deblocking 的 color / grayscale 两个）
    upstream: hooke007/dotfiles
    license: MIT
    extract: 7z
    install_to: Lib/site-packages/vapoursynth/plugins/vsmlrt/models/dpir
    # 上游包里有四个模型，各约 130 MB；只带 DPIR_DBLK_NV 用得到的两个
    # （model 2/3 -> deblocking_grayscale / deblocking_color），去噪用的
    # drunet_gray / drunet_color 由用户自己放进同一目录。
    exclude: ["drunet_color.onnx", "drunet_gray.onnx"]
    provides:
      - Lib/site-packages/vapoursynth/plugins/vsmlrt/models/dpir/drunet_deblocking_color.onnx
      - Lib/site-packages/vapoursynth/plugins/vsmlrt/models/dpir/drunet_deblocking_grayscale.onnx

  # ---- 其余模型（o5-null/mpv-playkit-pre 的 Release 资产，一族一个 zip） ----
  # 这些模型体积大又可选，单独发 Release，不塞进钩子仓库的 git 历史。
  # zip 内已带子目录，统一解到 vsmlrt/models 即可。
  - id: models-generic
    kind: archive
    summary: 通用超分模型（HFA2kCompact / Ani4Kv2 / AnimeJaNai V2,V3 / Anime1080Fixer）
    upstream: o5-null/mpv-playkit-pre
    license: MIT
    extract: zip
    install_to: Lib/site-packages/vapoursynth/plugins/vsmlrt/models
    provides:
      - Lib/site-packages/vapoursynth/plugins/vsmlrt/models/Phhofm_HFA2kCompact_x2_fp16_op17.onnx
      - Lib/site-packages/vapoursynth/plugins/vsmlrt/models/Sirosky_Ani4Kv2_UltraCompact_x2_fp16_op17.onnx
      - Lib/site-packages/vapoursynth/plugins/vsmlrt/models/the_database_AnimeJaNaiV2L1_x2_fp16_op17.onnx
      - Lib/site-packages/vapoursynth/plugins/vsmlrt/models/the_database_AnimeJaNaiV3L1_sharp_HD_x2_fp16_op17.onnx
      - Lib/site-packages/vapoursynth/plugins/vsmlrt/models/Zarxrax_Anime1080Fixer_SUC_x1_fp16_op17.onnx

  - id: models-artcnn
    kind: archive
    summary: ArtCNN 超分模型（R16F96 / R8F64 / R8F64_DS）
    upstream: o5-null/mpv-playkit-pre
    license: MIT
    extract: zip
    install_to: Lib/site-packages/vapoursynth/plugins/vsmlrt/models
    provides:
      - Lib/site-packages/vapoursynth/plugins/vsmlrt/models/ArtCNN/ArtCNN_R16F96.onnx
      - Lib/site-packages/vapoursynth/plugins/vsmlrt/models/ArtCNN/ArtCNN_R8F64.onnx
      - Lib/site-packages/vapoursynth/plugins/vsmlrt/models/ArtCNN/ArtCNN_R8F64_DS.onnx

  - id: models-rife
    kind: archive
    summary: RIFE 补帧模型（4.25 lite / 4.26 / 4.26 heavy / 4.6 / 4.6 ensemble）
    upstream: o5-null/mpv-playkit-pre
    license: MIT
    extract: zip
    install_to: Lib/site-packages/vapoursynth/plugins/vsmlrt/models
    provides:
      - Lib/site-packages/vapoursynth/plugins/vsmlrt/models/rife/rife_v4.25_lite.onnx
      - Lib/site-packages/vapoursynth/plugins/vsmlrt/models/rife/rife_v4.26.onnx
      - Lib/site-packages/vapoursynth/plugins/vsmlrt/models/rife/rife_v4.26_heavy.onnx
      - Lib/site-packages/vapoursynth/plugins/vsmlrt/models/rife/rife_v4.6.onnx
      - Lib/site-packages/vapoursynth/plugins/vsmlrt/models/rife/rife_v4.6_ensemble.onnx

  - id: models-rife-v2
    kind: archive
    summary: RIFE 补帧模型（TRT 用 rife_v2 目录，同一组模型）
    upstream: o5-null/mpv-playkit-pre
    license: MIT
    extract: zip
    install_to: Lib/site-packages/vapoursynth/plugins/vsmlrt/models
    provides:
      - Lib/site-packages/vapoursynth/plugins/vsmlrt/models/rife_v2/rife_v4.25_lite.onnx
      - Lib/site-packages/vapoursynth/plugins/vsmlrt/models/rife_v2/rife_v4.26.onnx
      - Lib/site-packages/vapoursynth/plugins/vsmlrt/models/rife_v2/rife_v4.26_heavy.onnx
      - Lib/site-packages/vapoursynth/plugins/vsmlrt/models/rife_v2/rife_v4.6.onnx
      - Lib/site-packages/vapoursynth/plugins/vsmlrt/models/rife_v2/rife_v4.6_ensemble.onnx

  - id: models-drba
    kind: archive
    summary: DRBA 去带模型（distilDRBA v1 / v2_lite 四变体，fp32 与 fp16 各一套）
    upstream: o5-null/mpv-playkit-pre
    license: MIT
    extract: zip
    install_to: Lib/site-packages/vapoursynth/plugins/vsmlrt/models
    # TRT 路径不拼 _fp16（K7sfunc mod_memc.py 只对 dml 加后缀），所以两套都带
    provides:
      - Lib/site-packages/vapoursynth/plugins/vsmlrt/models/drba/distilDRBA_v1.onnx
      - Lib/site-packages/vapoursynth/plugins/vsmlrt/models/drba/distilDRBA_v1_scale.onnx
      - Lib/site-packages/vapoursynth/plugins/vsmlrt/models/drba/distilDRBA_v1_ap.onnx
      - Lib/site-packages/vapoursynth/plugins/vsmlrt/models/drba/distilDRBA_v1_scale_ap.onnx
      - Lib/site-packages/vapoursynth/plugins/vsmlrt/models/drba/distilDRBA_v1_fp16.onnx
      - Lib/site-packages/vapoursynth/plugins/vsmlrt/models/drba/distilDRBA_v1_scale_fp16.onnx
      - Lib/site-packages/vapoursynth/plugins/vsmlrt/models/drba/distilDRBA_v1_ap_fp16.onnx
      - Lib/site-packages/vapoursynth/plugins/vsmlrt/models/drba/distilDRBA_v1_scale_ap_fp16.onnx
      - Lib/site-packages/vapoursynth/plugins/vsmlrt/models/drba/distilDRBA_v2_lite.onnx
      - Lib/site-packages/vapoursynth/plugins/vsmlrt/models/drba/distilDRBA_v2_lite_scale.onnx
      - Lib/site-packages/vapoursynth/plugins/vsmlrt/models/drba/distilDRBA_v2_lite_ap.onnx
      - Lib/site-packages/vapoursynth/plugins/vsmlrt/models/drba/distilDRBA_v2_lite_scale_ap.onnx
      - Lib/site-packages/vapoursynth/plugins/vsmlrt/models/drba/distilDRBA_v2_lite_fp16.onnx
      - Lib/site-packages/vapoursynth/plugins/vsmlrt/models/drba/distilDRBA_v2_lite_scale_fp16.onnx
      - Lib/site-packages/vapoursynth/plugins/vsmlrt/models/drba/distilDRBA_v2_lite_ap_fp16.onnx
      - Lib/site-packages/vapoursynth/plugins/vsmlrt/models/drba/distilDRBA_v2_lite_scale_ap_fp16.onnx

  # 许可与来源说明：NVIDIA 运行库可再分发，但必须随附许可原文。
  - id: pack-attribution
    kind: repo-files
    summary: TensorRT-RTX 许可与来源说明
    upstream: o5-null/mpv-playkit-pre
    license: MIT
    files:
      - source: configs/packs/tensorrt-rtx-THIRD-PARTY.md
        target: vs-plugins/tensorrt-rtx/THIRD-PARTY.md
      - source: configs/packs/tensorrt-rtx-LICENSE.txt
        target: vs-plugins/tensorrt-rtx/LICENSE.txt
