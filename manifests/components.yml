# mpv-playkit-pre 组件规则清单
#
# 分层说明（参照 100pangci/mpv_PlayKit_TLS）
#   本文件 = 规则：组件是什么、怎么装、装到哪、什么许可。改动频率低。
#   sources.lock.json = 钉住的版本与哈希。改动频率高（换版本时）。
#   `python -m build.pin --id <id> --url <url>` 会下载资产、算 sha256 并写入 lock。
#
# 字段
#   id          组件标识（--with/--without、日志、BUILD_INFO 都用它）
#   kind        mpv-7z | archive | whl | file | git-tree | repo-files
#   summary     一句话说明（会写进 docs 与报错信息）
#   upstream    上游仓库，仅作溯源记录，构建不访问它
#   members     kind=mpv-7z：从 7z 中只取这些文件，放到包根
#   extract     kind=archive：7z | zip
#   exclude     kind=archive：整树复制时排除的路径（前缀或通配符）
#   include     kind=archive：只装命中白名单的路径（前缀或通配符），与 exclude 叠加
#   install_to  安装目录（相对包根，默认 "."）
#   copies      装完后把 source（相对包根）复制到 target（相对包根）
#   python_pth  true 表示安装后补写 <python*._pth>：加 site-packages 并启用 site
#   target      kind=file：落地路径
#   files       kind=repo-files：{source, target} 列表，source 相对仓库根
#   paths       kind=git-tree：{source, target} 映射，source 相对仓库根
#   disable     true 表示默认不装，需 `--with <id>` 显式启用
#   license     SPDX 标识，写进 licenses/THIRD_PARTY.md
#
# 版本在这里是看不到的——故意的：换版本只动 lock，不动规则，diff 干净。

schema: 1

project:
  name: mpv-playkit-pre
  platform: windows-x64
  upstream: hooke007/mpv_PlayKit
  description: 追踪最新组件版本的 Windows x64 便携 mpv 预览包（mpv_PlayKit 配置 + 自维护 K7sfunc）

components:
  # mpv 主体：我们自行维护的构建（o5-null/mpv fork，含 vf_playkit 帧倍增滤镜）。
  # 发行物是该仓库 release 上的平铺 zip：mpv.exe / mpv.com + MSYS2 CLANG64 的
  # 依赖 DLL 闭包（avcodec / libplacebo / libass / lua51 / vulkan-1 ...）。
  # 与 shinchiro 官方构建的差别：这里动态链接，DLL 随包平铺，不再依赖系统里的
  # MSYS2 运行时；也不再带 d3dcompiler_43.dll（Win10/11 系统自带 47 版）。
  # 本地调试可用环境变量 PLAYKIT_MPV_ARCHIVE 指向自己编出来的 zip 做覆盖。
  - id: mpv
    kind: archive
    summary: mpv 播放器（自维护构建，含 vf_playkit）
    upstream: o5-null/mpv
    license: GPL-2.0-or-later
    extract: zip
    install_to: .
    provides:
      - mpv.exe
      - mpv.com

  # yt-dlp 官方单文件可执行（Windows）。mpv 的 ytdl_hook 会在包根找它，
  # 所以在线播放（YouTube/Bilibili 等）开箱可用。属于基础包，不是依赖包。
  - id: yt-dlp
    kind: file
    summary: yt-dlp 单文件可执行（在线播放支持）
    upstream: yt-dlp/yt-dlp
    license: Unlicense
    target: yt-dlp.exe

  # 官方 CPython 嵌入式发行版（python.org 的 embed 包，不带 pip / Lib / tools）
  # 解压到包根：python.exe / python3.dll / pythonXY.dll / pythonXY.zip / pythonXY._pth
  # 不装 LibreOffice 式完整发行版的原因：体积与用途都只为 VapourSynth 提供解释器。
  - id: python
    kind: archive
    summary: 官方 CPython 3.15 嵌入式发行版
    upstream: python/cpython
    license: PSF-2.0
    extract: zip
    install_to: .
    python_pth: true
    exclude:
      - Include
      - Libs
      - tools
      - python3t.dll
      - python.cat
      - build-details.json
      - "*.pdb"

  # 官方 VapourSynth wheel：解到 Lib/site-packages 供 Python 导入，
  # 同时把运行时 DLL 复制到包根——mpv 的 vf=vapoursynth 只从 mpv.exe 同目录
  # 找 VSScript.dll，而 R82 起该 DLL 不再编译期链接 Python，需要配套一行
  # 运行时配置（由 k7f_vs.lua 首次运行写入，见 docs/DECISIONS.md）。
  - id: vapoursynth
    kind: whl
    summary: 官方 VapourSynth R82（CPython 扩展 + 运行时 DLL）
    upstream: vapoursynth/vapoursynth
    license: LGPL-2.1-or-later
    install_to: Lib/site-packages
    # wheel 里的开发物：__pycache__/头文件/pkgconfig/调试符号，装包时一律丢掉
    exclude:
      - vapoursynth/__pycache__
      - vapoursynth/include
      - vapoursynth/pkgconfig
      - "*.pdb"
    copies:
      - source: Lib/site-packages/vapoursynth/vsscript.dll
        target: vsscript.dll
      - source: Lib/site-packages/vapoursynth/libvapoursynth.dll
        target: libvapoursynth.dll
      - source: Lib/site-packages/vapoursynth/libvapoursynthfilters.dll
        target: libvapoursynthfilters.dll
      - source: Lib/site-packages/vapoursynth/libvapoursynthfilters_avx2.dll
        target: libvapoursynthfilters_avx2.dll
      - source: Lib/site-packages/vapoursynth/libvapoursynthfilters_zn4.dll
        target: libvapoursynthfilters_zn4.dll
      - source: Lib/site-packages/vapoursynth/vsvfw.dll
        target: vsvfw.dll

  # ---- VapourSynth 插件生态 ----
  # K7sfunc 的模块按插件名做依赖检查（_check_plugin），没有这些插件就只能跑纯内置滤镜。
  # 全部取自 PyPI 上按 API 4 编译的轮子（R80 起 API 3 被移除，作者已跟进）：
  # wheel 内的 DLL 都落在 vapoursynth/plugins/，R82 会递归扫描该目录自动加载。
  - id: vs-plugin-akarin
    kind: whl
    summary: akarin 滤镜组（Expr/Transpose/Loop 等，K7sfunc 多数模块依赖）
    upstream: AkarinVS/vapoursynth-akarin
    license: LGPL-3.0-or-later
    install_to: Lib/site-packages
    exclude: ["*.dist-info", "*.dist-info/*"]
    provides:
      - Lib/site-packages/vapoursynth/plugins/akarin/libakarin.dll

  - id: vs-plugin-mvtools
    kind: whl
    summary: mvtools（运动估计，补帧/降噪模块依赖）
    upstream: dubhater/vapoursynth-mvtools
    license: GPL-2.0-or-later
    install_to: Lib/site-packages
    exclude: ["*.dist-info", "*.dist-info/*"]
    provides:
      - Lib/site-packages/vapoursynth/plugins/mvtools.dll

  - id: vs-plugin-fmtconv
    kind: whl
    summary: fmtconv（高精度格式转换）
    upstream: EleonoreMizo/fmtconv
    license: WTFPL
    install_to: Lib/site-packages
    exclude: ["*.dist-info", "*.dist-info/*"]
    provides:
      - Lib/site-packages/vapoursynth/plugins/fmtconv.dll

  - id: vs-plugin-zsmooth
    kind: whl
    summary: zsmooth（mvtools 上的时域降噪）
    upstream: home-of-the-sane/zsmooth
    license: MIT
    install_to: Lib/site-packages
    exclude: ["*.dist-info", "*.dist-info/*"]
    provides:
      - Lib/site-packages/vapoursynth/plugins/zsmooth/zsmooth.dll

  - id: vs-plugin-bm3d
    kind: whl
    summary: bm3d（BM3D 降噪）
    upstream: home-of-the-sane/vapoursynth-bm3d
    license: MIT
    install_to: Lib/site-packages
    exclude: ["*.dist-info", "*.dist-info/*"]
    provides:
      - Lib/site-packages/vapoursynth/plugins/bm3d.dll

  - id: vs-plugin-bwdif
    kind: whl
    summary: bwdif（反交错）
    upstream: home-of-the-sane/vapoursynth-bwdif
    license: GPL-3.0-or-later
    install_to: Lib/site-packages
    exclude: ["*.dist-info", "*.dist-info/*"]
    provides:
      - Lib/site-packages/vapoursynth/plugins/bwdif.dll

  - id: vs-plugin-vivtc
    kind: whl
    summary: vivtc（VFR 转 CFR / 场匹配）
    upstream: dubhater/vapoursynth-vivtc
    license: MIT
    install_to: Lib/site-packages
    exclude: ["*.dist-info", "*.dist-info/*"]
    provides:
      - Lib/site-packages/vapoursynth/plugins/vivtc.dll

  - id: vs-plugin-tivtc
    kind: whl
    summary: tivtc（TIVTC 反胶卷过带）
    upstream: dubhater/vapoursynth-tivtc
    license: GPL-3.0-or-later
    install_to: Lib/site-packages
    exclude: ["*.dist-info", "*.dist-info/*"]
    provides:
      - Lib/site-packages/vapoursynth/plugins/tivtc.dll

  - id: vs-plugin-vszip
    kind: whl
    summary: vszip（帧缓冲区运算，去色带/亮度调整用）
    upstream: dnjulek/vapoursynth-zip
    license: MIT
    install_to: Lib/site-packages
    exclude: ["*.dist-info", "*.dist-info/*"]
    provides:
      - Lib/site-packages/vapoursynth/plugins/vszip/vszip.dll

  - id: vs-plugin-znedi3
    kind: whl
    summary: znedi3（nnedi3 的 AVX2 实现，超分/反交错）
    upstream: sekrit-twc/znedi3
    license: GPL-3.0-or-later
    install_to: Lib/site-packages
    exclude: ["*.dist-info", "*.dist-info/*"]
    provides:
      - Lib/site-packages/vapoursynth/plugins/znedi3.dll
      - Lib/site-packages/vapoursynth/plugins/nnedi3_weights.bin

  # 帧生成插件的四个 VS 插件 DLL（约 0.6 MB），基础包自带，开箱能 `core.std.LoadPlugin`。
  # 引擎不在这里：DLSS-G / XeSS-FG 的 NGX 引擎包按档位走 manifests/packs/vsdlssg.yml。
  # 落点放在 vs-plugins/ 而不是 vapoursynth/plugins/：MEMC_*.vpy 先 hasattr 检查、
  # 没有再 LoadPlugin 这个路径，避免"自动加载 + 手动加载"两份实例。
  - id: vs-framegen-dlls
    kind: archive
    summary: 帧生成插件 DLL（vdlssg / vxessfg / vvfg / vfsr4）
    upstream: o5-null/vs-framegen
    license: MIT
    extract: zip
    install_to: .
    # 发行包里的引擎与运行时目录（v0.2.0 起是 vs-plugins/dlss45、vs-plugins/xessfg，
    # 另有 vfg/、fsr4/ 两颗引擎的运行时；旧版是 vs-plugins/bin/<引擎>）
    # 基础包只要四个 DLL，这些目录交给档位包
    exclude:
      - vs-plugins/dlss45
      - vs-plugins/xessfg
      - vs-plugins/vfg
      - vs-plugins/fsr4
      - vs-plugins/bin
    provides:
      - vs-plugins/vdlssg.dll
      - vs-plugins/vxessfg.dll
      - vs-plugins/vvfg.dll
      - vs-plugins/vfsr4.dll

  # 包布局文件：便携标记（portable.vs）与插件目录占位。
  # 没有版本，也不下载——直接取自本仓库 configs/。
  - id: playkit-layout
    kind: repo-files
    summary: 便携布局文件（portable.vs / vs-plugins）
    upstream: o5-null/mpv-playkit-pre
    license: MIT
    files:
      - source: configs/portable.vs
        target: portable.vs
      - source: configs/vs-plugins.keep
        target: vs-plugins/.keep

  # K7sfunc：自维护 fork 的源码树（不是 PyPI wheel）
  # 钉住的是 fork 的 commit；tarball 剥掉顶层目录后按 paths 复制。
  # 只取需要的东西：整个 src/k7sfunc 包 + 本 fork 新增的前端文件，
  # 不碰上游 mpv/ 里的 mpv.conf / input.conf（那会覆盖 mpv_PlayKit 的主配置）。
  - id: k7sfunc
    kind: git-tree
    summary: K7sfunc 自维护 fork（含 PLAYKIT 预设与前端）
    upstream: o5-null/K7sfunc
    license: GPL-3.0-or-later
    paths:
      - source: src/k7sfunc
        target: Lib/site-packages/k7sfunc
      - source: mpv/portable_config/scripts/k7f_playkit.lua
        target: portable_config/scripts/k7f_playkit.lua
      - source: mpv/portable_config/scripts/k7f_vs.lua
        target: portable_config/scripts/k7f_vs.lua
      # vpy ⇄ mpv 公用参数桥：下行 user-data 拼装 + 上行 .k7f.json 报告
      - source: mpv/portable_config/scripts/k7f_bridge.lua
        target: portable_config/scripts/k7f_bridge.lua
      - source: mpv/portable_config/scripts/k7f_vpypar.lua
        target: portable_config/scripts/k7f_vpypar.lua
      - source: mpv/portable_config/script-opts/k7f_playkit.conf
        target: portable_config/script-opts/k7f_playkit.conf
      # 帧生成补帧脚本（DLSS-G / XeSS-FG / VFG / FSR4）；插件 DLL 在基础组件，引擎在档位包
      - source: mpv/portable_config/vs
        target: portable_config/vs
      - source: LICENSE
        target: licenses/k7sfunc-LICENSE
      - source: src/LICENSE
        target: licenses/k7sfunc-src-LICENSE
