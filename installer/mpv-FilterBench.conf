# 补帧滤镜性能测试的公共播放参数
# 由 installer\mpv-补帧滤镜跑分.bat 以 --include 引入，--vf 与 --script-opts 在命令行上按分辨率/倍数覆盖。
# 注意：被 --include 的文件里 "~~/" 不指向 portable_config，所以涉及路径的选项都放在命令行上。

vo=gpu-next
gpu-context=d3d11
# 滤镜要 D3D11 硬件帧，必须硬解
hwdec=d3d11va
hwdec-codecs=all
# 默认 flip + sync-interval=1 会把呈现压到 66fps 左右，跑分必须关掉
d3d11-flip=no
d3d11-sync-interval=0
video-sync=display-desync
# 不看时钟，全速跑，只测吞吐
untimed=yes
# 每遍的输出帧数（补帧后交付给 VO 的帧数）；multi=2 时相当于 300 对输入帧
frames=600
audio=no
sub=no
osc=no
osd-level=0
# 小窗口，压低呈现端开销；滤镜吞吐仍然是全分辨率
force-window=yes
hidpi-window-scale=no
autofit=960x540
geometry=50%:50%
# 只留探针脚本的 info 输出，其余噪音降级（脚本名里的 "-" 会被 mpv 归一化成 "_"）
msg-level=all=warn,mpv_filter_bench=info
