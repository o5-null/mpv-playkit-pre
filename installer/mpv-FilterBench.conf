# Shared playback options for the frame-interpolation filter benchmark
# Pulled in with --include by installer\mpv-FilterBench.bat; --vf and --script-opts
# are given per resolution/multi on the command line.
# Note: inside a file loaded with --include, "~~/" does not resolve to
# portable_config, so every path-carrying option stays on the command line.

vo=gpu-next
gpu-context=d3d11
# The filters need D3D11 hardware frames, so hardware decoding is mandatory
hwdec=d3d11va
hwdec-codecs=all
# Default flip + sync-interval=1 pin presentation at ~66fps; a benchmark must drop both
d3d11-flip=no
d3d11-sync-interval=0
video-sync=display-desync
# Ignore the clock and run flat out, measuring throughput only
untimed=yes
# Output frames per run (frames delivered to the VO after interpolation)
frames=600
audio=no
sub=no
osc=no
osd-level=0
# Small window keeps presentation cost down; the filters still run at full size
force-window=yes
hidpi-window-scale=no
autofit=960x540
geometry=50%:50%
# Keep only the probe script's info output; mute the rest ("-" in the script
# name is normalized to "_" by mpv)
msg-level=all=warn,mpv_filter_bench=info
