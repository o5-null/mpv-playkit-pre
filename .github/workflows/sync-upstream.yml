# 上游同步工作流：把 hooke007/mpv_PlayKit 的配置与安装器整目录替换进来。
# 上游只同步 portable_config/ 与 installer/ 两个目录，本项目的 build/、toolkit/、
# overlay/、manifests/ 由本地维护，二者互不相交，所以永远不会冲突。
name: sync-upstream

on:
  schedule:
    # 每天 UTC 03:00（北京时间 11:00）跑一次
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 准备 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 安装构建期依赖
        run: pip install -r requirements.txt

      # sync 的退出码语义：0 = 有更新，3 = 上游无变化。
      # 因此退出码 3 视为成功（不算失败），其余非零才让 job 失败。
      - name: 同步上游目录
        id: sync
        shell: bash
        continue-on-error: false
        run: python -m build sync || [ $? -eq 3 ]

      - name: 提交并推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore: 同步上游 hooke007/mpv_PlayKit"
          git push
