# 构建工作流：只产出 artifact，故意不发布 release、不推 tag。
# 产物统一通过 Actions artifact 交付，避免仓库里出现游离的发布版本，
# 也避免 tag 与 VERSION 文件产生版本号双份真相。
#
# 触发方式：不跟着 push 跑。平时在本地用 `python -m build ci` 复现同样的步骤，
# 本地全绿再推；这里只在每日定时和手动触发时验证，避免每次推送失败都刷一封信。
name: build

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  windows-x64:
    name: windows-x64
    runs-on: windows-latest
    env:
      # runner 默认 locale 是 en-US，强制 Python 用 UTF-8，日志里的中文才不会炸
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - name: 检出仓库
        uses: actions/checkout@v5

      - name: 准备 Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 安装构建期依赖
        run: pip install -r requirements.txt

      # 下载目录按 sources.lock.json 的哈希做 key：锁定文件不变就无需重新下载数百 MB 组件
      - name: 恢复下载缓存
        uses: actions/cache@v5
        with:
          path: .work/downloads
          key: downloads-${{ runner.os }}-${{ hashFiles('sources.lock.json') }}

      - name: 下载并校验组件
        run: python -m build fetch

      - name: 装配 stage 目录
        run: python -m build assemble

      - name: 运行冒烟测试
        run: python -m build smoke

      - name: 校验 stage 目录
        run: python -m build verify --stage

      # 两个档位都是全量包（full: true），各自带完整播放器，产物在 dist/out/*-windows-x64-<档位>.zip
      - name: 打全量包
        run: python -m build pack

      - name: 校验全量包
        shell: bash
        run: |
          for f in dist/out/*-windows-x64-vsdlssg.zip dist/out/*-windows-x64-vs-mlrt.zip; do
            python -m build verify --pack --asset "$f"
          done

      - name: 上传全量包
        uses: actions/upload-artifact@v7
        with:
          name: mpv-playkit-pre-windows-x64
          path: |
            dist/out/*-windows-x64-vsdlssg.zip
            dist/out/*-windows-x64-vs-mlrt.zip
          if-no-files-found: error
          retention-days: 14
